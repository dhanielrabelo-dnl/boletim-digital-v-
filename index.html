<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Cabeçalho principal -->
  <header class="cabecalho">
    <h1>Boletim Digital</h1>
    <p class="subtitulo">8º Ano — Turma 8C — Nº 4</p>
  </header>

  <main class="conteudo">

    <!-- Tela de acesso por PIN -->
    <section class="acesso" id="areaAcesso">
      <h2>Acesso ao Boletim</h2>
      <p class="acesso-info">Turma: <strong>8C</strong> — Número de chamada: <strong>4</strong></p>

      <div class="acesso-form">
        <label for="campoPin">Digite seu PIN:</label>
        <input type="password" id="campoPin" inputmode="numeric" autocomplete="off" maxlength="20" placeholder="PIN" />
        <button id="botaoEntrar" type="button">Entrar</button>
      </div>

      <p class="acesso-status" id="statusAcesso"></p>
    </section>

    <!-- Área do boletim (oculta até o login) -->
    <section class="boletim" id="areaBoletim" hidden>

      <!-- Área dos cards de resumo -->
      <section class="cards" id="cardsResumo">
        <!-- Os cards serão preenchidos pelo JavaScript -->
      </section>

      <!-- Área dos gráficos -->
      <section class="area-graficos" id="areaGraficos">

        <article class="grafico-card">
          <h2>Média por disciplina</h2>
          <div class="grafico-container">
            <canvas id="graficoMediasDisciplinas"></canvas>
          </div>
        </article>

        <article class="grafico-card">
          <h2>Evolução da média geral</h2>
          <div class="grafico-container">
            <canvas id="graficoEvolucaoTrimestres"></canvas>
          </div>
        </article>

        <article class="grafico-card" id="graficoCardFaltas">
          <h2>Faltas no ano</h2>
          <div id="estadoFaltas"></div>
          <div class="grafico-container">
            <canvas id="graficoFaltasTrimestres"></canvas>
          </div>
        </article>

      </section>

      <!-- Área da tabela -->
      <section class="tabela-container">
        <h2>Notas por Disciplina</h2>

        <div class="tabela-responsiva">
          <table>
            <thead>
              <tr>
                <th>Disciplina</th>
                <th>1º Tri</th>
                <th>2º Tri</th>
                <th>3º Tri</th>
                <th>Média</th>
                <th>Faltas</th>
                <th>Situação</th>
              </tr>
            </thead>
            <tbody id="corpoTabela">
              <!-- As linhas serão criadas pelo JavaScript -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- Controles de edição -->
      <section class="controles" id="areaControles" hidden>
        <button id="botaoSalvar" type="button">Salvar alterações</button>
        <button id="botaoCancelar" type="button">Cancelar edição</button>
        <p class="edicao-status" id="statusEdicao"></p>
      </section>

      <section class="controles" id="areaAlterar">
        <button id="botaoAlterar" type="button">Alterar dados</button>
      </section>

    </section>

  </main>

  <footer class="rodape">
    <p>Projeto escolar — dados fictícios para demonstração.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
